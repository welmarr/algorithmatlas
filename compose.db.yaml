services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: ${SIM_DB_PASSWORD:?Set SIM_DB_PASSWORD for local PostgreSQL}
      POSTGRES_DB: simulator
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulator -d simulator"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    environment:
      DATABASE_URL: postgres://simulator:${SIM_DB_PASSWORD}@db:5432/simulator
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
