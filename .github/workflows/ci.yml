name: CI
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  problem-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm problems:release
  validate:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports:
          - 11025:1025
          - 18025:8025
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: simulator
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: simulator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simulator -d simulator"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://simulator:ci-only-password@127.0.0.1:5432/simulator
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "11025"
      MAILPIT_API: http://127.0.0.1:18025
      E2E_PRODUCTION: "1"
      PERF_BROWSER: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:full
        env:
          PG_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm verify:public-runner
      - run: pnpm verify:prod-ops
